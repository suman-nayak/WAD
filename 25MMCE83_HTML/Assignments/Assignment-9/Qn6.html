<body>
    <script>
         function real_time()
        {
            let date =new Date();
            let a = date.toLocaleDateString("en-IN");
            let b=date.toLocaleTimeString('en-IN');
            console.log(`Date: ${a}`);
            console.log(`time: ${b}`);
        }
        real_time();
    </script>
</body>
