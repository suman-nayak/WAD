<!-- 7. Create a function that checks if a given string is a palindrome.-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palin</title>
 </head>
 <body>
    <script>
        function palin(str)
        {
            let rev=""
            for(let i=str.length;i>=0;i--)
            {
                rev+=str.charAt(i);
            }

        if(str==rev)
        {
            console.log(`${str} is a palindrome.`)
        }
        else{
            console.log(`${str} is a not palindrome.`)
        }
        }

        let str="aba";
        palin(str);
    </script>
 </body>
 </html>
