<!-- 1. Create a function gradeCalculator(score) that takes a score (0-100) and returns the
corresponding grade: "A" for 90-100, "B" for 80-89, "C" for 70-79, "D" for 60-69, and
"F" for anything below 60. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One</title>
</head>
<body>
    
    <script>
        function gradeCalculator(score)
        {
            if(score>=90 && score<=100)
        {
            return 'A';
        }
            if(score>=80 && score<=89)
            {
            return 'B';
            }
        
            if(score>=70 && score<=79)
        {
            return 'C';
        }

            if(score>=60 && score<=69)
        {
            return 'D';
        }

            if(score<=60)
        {
            return 'F';
        }
    }
    let mark=50;
    let l=gradeCalculator(mark);
    console.log(`${mark} is score and grade is ${l}`);
    </script>
</body>
</html>
