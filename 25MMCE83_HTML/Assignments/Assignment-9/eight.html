<!-- 8. Write a JS function that takes an array and returns a new array with duplicate values
removed. --> 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eight</title>
</head>
<body>
<script>
function removedup(num) {
    let crr = [];
    for(let i = 0; i < num.length; i++) {
        let flag = false;
        for(let j = 0; j < i; j++) {
            if(num[i] == num[j]) {
                flag = true;
                break;
            }
        }
        if(!flag) {
            crr.push(num[i]);
        }
    }
    return crr;
}
  let nums = [1, 5, 2, 7, 3, 7, 10, 7, 9];
console.log(removedup(nums));
</script>
</body>
</html>
