<!-- 4. Create a function arraySum(arr) that takes an array of numbers and returns the sum of
all its elements. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four</title>
</head>
<body>
    <script>
        function arraySum(arr)
        {
            let sum=0;
            for(let i=0;i<arr.length;i++)
            {
                sum+=arr[i];
            }
            return sum;
        }
        let nums = [1, 5, 2, 7, 3, 7, 10, 7, 9];
        let s=arraySum(nums);
        console.log(`The sum of Number is ${s}`);
    </script>
</body>
</html>
