<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qn1</title>
</head>
<body>
    <script>
        function gradeCalculator(score){
            if (score >= 90 || score <= 100)
            {
                return "A";
            }
            else if (score >= 80 || score <= 90)
            {
                return "B";
            }
            else if (score >= 70 || score <= 79)
            {
                return "c";
            }
            else if (score >= 60 || score <= 69)
            {
                return "D";
            }
            else{
                return "F"
            }
        }
        let mark = 77;
        let l = gradeCalculator(mark)
        console.log(`${mark} is score and Grade is ${l}`);
    </script>
</body>
</html>
