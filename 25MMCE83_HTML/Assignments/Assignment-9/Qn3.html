<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qn3</title>
</head>
<body>
    <script>
        function isPrime(num)
        {
            let flag=false;
            if(num==0 || num==1)
        {
            console.log("Neither Prime Nor Composite Number");
            return 0;
        }
            for(let i=2;i<num;i++)
             {
                if(num%i==0)
                {
                    flag=true;
                    break;
                 }
            }
            if(flag==true)
            {
                console.log("Not Prime Number");
            }
            else{
                console.log("Prime Number");
            }
        }

        isPrime(3);
    </script>
</body>
</html>
