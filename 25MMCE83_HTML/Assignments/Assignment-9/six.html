<!-- 6. Write a function that returns the current date and time in the format "DD/MM/YYYY
HH:mm AM/PM" -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Six</title>
</head>
<body>
    <script>
        function real_time()
        {
            let date =new Date();
            let a = date.toLocaleDateString("en-IN");
            let b=date.toLocaleTimeString('en-IN');
            console.log(`Date is ${a} and time is ${b}`);
        }
        real_time();
    </script>
</body>
</html>
