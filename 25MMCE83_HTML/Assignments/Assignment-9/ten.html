<!-- 10.Take two numbers as input from user using dialog boxes and display if the first
number is divisible by the second number in another dialog box -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ten</title>
</head>
<body>
    <script>
        let a= prompt("Enter First Number: ");
        let b=prompt("Enter Second Number:")
        console.log("Divisible");
        if(b==0)
        {
        console.log(alert("Not divisible by 0"));
        }
        else{
            console.log(alert(`Division: ${a/b}`));
        }
    </script>
</body>
</html>
