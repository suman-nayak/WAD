<!DOCTYPE html>
<html>
<head>
    <title>Electricity Bill Calculator</title>
</head>
<body>

    <h1>Electricity Bill Calculator</h1>

    <label>Consumer Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Units Consumed:</label>
    <input type="number" id="units">
    <br><br>

    <button onclick="calculateBill()">Calculate Bill</button>

    <h2 id="result"></h2>

    <script>
        function calculateBill() {

            let name = document.getElementById("name").value;
            let units = Number(document.getElementById("units").value);

            let charge1 = 0;
            let charge2 = 0;
            let charge3 = 0;
            let charge4 = 0;
            let meterCharge = 50;

            if(name == "") {
                alert("Please enter consumer name");
            }
            else if(document.getElementById("units").value == "" || units <= 0) {
                alert("Units consumed must be a positive number");
            }
            else {

                if(units <= 100) {
                    charge1 = units * 2;
                }
                else {
                    charge1 = 100 * 2;
                }

                if(units > 100) {
                    if(units <= 200) {
                        charge2 = (units - 100) * 3;
                    }
                    else {
                        charge2 = 100 * 3;
                    }
                }

                if(units > 200) {
                    if(units <= 500) {
                        charge3 = (units - 200) * 5;
                    }
                    else {
                        charge3 = 300 * 5;
                    }
                }

                if(units > 500) {
                    charge4 = (units - 500) * 7;
                }

                let totalCharge = charge1 + charge2 + charge3 + charge4;
                let totalBill = totalCharge + meterCharge;

                document.getElementById("result").innerHTML =
                    "Consumer Name: " + name + "<br><br>" +
                    "Units Consumed: " + units + "<br><br>" +
                    "First 100 Units Charge: Rs. " + charge1 + "<br>" +
                    "Next 100 Units Charge: Rs. " + charge2 + "<br>" +
                    "Next 300 Units Charge: Rs. " + charge3 + "<br>" +
                    "Above 500 Units Charge: Rs. " + charge4 + "<br><br>" +
                    "Total Energy Charge: Rs. " + totalCharge + "<br>" +
                    "Meter Charge: Rs. " + meterCharge + "<br><br>" +
                    "Final Payable Amount: Rs. " + totalBill;
            }
        }
    </script>

</body>
</html>
