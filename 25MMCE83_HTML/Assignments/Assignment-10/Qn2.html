<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>
</head>
<body>

    <h1>Character Counter</h1>

    <textarea id="text" rows="5" cols="30"
        oninput="countCharacter()"></textarea>

    <p id="result">Remaining Characters: 100</p>

    <script>
        function countCharacter() {

            let text = document.getElementById("text");
            let result = document.getElementById("result");

            let count = text.value.length;
            let remaining = 100 - count;

            if(count > 100) {
                result.innerHTML = "Character limit reached!";
                result.style.color = "red";
            } else {
                result.innerHTML = "Remaining Characters: " + remaining;
                result.style.color = "black";
            }
        }
    </script>

</body>
</html>
