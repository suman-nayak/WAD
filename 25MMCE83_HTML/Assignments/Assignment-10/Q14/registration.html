<!DOCTYPE html>
<html>
<head>
    <title>Online Learning Registration</title>

    <style>
        .input {
            display: block;
            margin-bottom: 4px;
        }

        .error {
            display: block;
            color: red;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>Online Learning Platform</h1>
    <h2>User Registration Form</h2>

    <form action="thankyou.html" method="post" onsubmit="validate(event)">

        <!-- Full Name -->
        <label>Full Name</label>
        <input type="text" id="name" class="input" oninput="validateName()">
        <label class="error" id="nameError"></label>

        <!-- Gender -->
        <label>Gender</label>
        <div>
            <input type="radio" name="gender" id="male" value="Male" onchange="validateGender()"> Male

            <input type="radio" name="gender" id="female" value="Female" onchange="validateGender()"> Female

            <input type="radio" name="gender" id="other" value="Other" onchange="validateGender()"> Other
        </div>
        <label class="error" id="genderError"></label>

        <!-- Username -->
        <label>Username</label>
        <input type="text" id="username" class="input" oninput="validateUsername()">
        <label class="error" id="usernameError"></label>

        <!-- Email -->
        <label>Email Address</label>
        <input type="email" id="email" class="input" oninput="validateEmail()">
        <label class="error" id="emailError"></label>

        <!-- Mobile -->
        <label>Mobile Number</label>
        <input type="text" id="mobile" class="input" oninput="validateMobile()">
        <label class="error" id="mobileError"></label>

        <!-- DOB -->
        <label>Date of Birth</label>
        <input type="date" id="dob" class="input" onchange="validateDOB()">
        <label class="error" id="dobError"></label>

        <!-- Country -->
        <label>Country</label>
        <select id="country" class="input" onchange="validateCountry()">
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
        </select>
        <label class="error" id="countryError"></label>

        <!-- Password -->
        <label>Password</label>
        <input type="password" id="password" class="input" oninput="validatePassword()">
        <label class="error" id="passwordError"></label>

        <!-- Confirm Password -->
        <label>Confirm Password</label>
        <input type="password" id="password2" class="input" oninput="validatePassword2()">
        <label class="error" id="password2Error"></label>

        <br>

        <input type="submit" value="Register">

    </form>

    <script src="validation.js"></script>

</body>
</html>
