<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
</head>
<body>

    <h1>Currency Converter</h1>

    <label>USD ($):</label>
    <input type="number" id="usd" oninput="convertUSD()">

    <br><br>

    <label>INR (₹):</label>
    <input type="number" id="inr" oninput="convertINR()">

    <script>

        function convertUSD() {

            let usd = Number(document.getElementById("usd").value);
            let inr = usd * 80;
            document.getElementById("inr").value = inr;

        }

        function convertINR() {

            let inr = Number(document.getElementById("inr").value);
            let usd = inr / 80;
            document.getElementById("usd").value = usd;

        }

    </script>

</body>
</html>
