<!-- 2. Take a number as input from the user in an HTML input field and check
if the number is a prime number or not, using jQuery. Display the
message in a paragraph -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two</title>
</head>

<body>
    <h1>Prime Number Checker</h1>
    <label for="num">Enter a Number:</label>
    <input type="number" name="num" id="num">
    <input type="submit" value="Submit" id="submit">
    <p id="result"></p>
    <script src="./Jq/jquery-4.0.0.js"></script>
    <script>
        $(document).ready(function () {
            $("#submit").on("click", function (e) {
                e.preventDefault();
                let num = Number($("#num").val());
                // console.log(num);
                if (num < 0|| num==" ") {
                    $("#result").text("Enter a Positive Number");
                    return;
                }
                if (num == 0 || num==1) {
                    $("#result").text("Neither Prime Nor Composite..");
                    return;
                }

                let flag = false;
                for (let i = 2; i < num; i++) {
                    if (num % i == 0) {
                        flag = true;
                        break;
                    }
                }
                if (flag == false) {
                    $("#result").text("Prime Number");
                }
                else {
                    $("#result").text(" Not a Prime Number");
                }
            })
        })
    </script>
</body>

</html>
