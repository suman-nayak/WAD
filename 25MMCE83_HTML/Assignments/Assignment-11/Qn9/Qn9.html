
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container my-4">
        <h2>Student Records</h2>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>SIC</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>CGPA</th>
                </tr>
            </thead>

            <tbody id="studentsContainer">

            </tbody>
        </table>
    </div>

    <script src="./../jquery-4.0.0.js"></script>

    <script>
        function display(){
            $.ajax({
                url: "student_display.php",
                method: "GET",

                success: function(res){
                    let students = JSON.parse(res);
                    console.log(students);

                    let htmlStr = ``;

                    for(let s of students){
                        htmlStr += `<tr>`;
                        htmlStr += `<td>${s.sic}</td>`;
                        htmlStr += `<td>${s.name}</td>`;
                        htmlStr += `<td>${s.branch}</td>`;
                        htmlStr += `<td>${s.cgpa}</td>`;
                        htmlStr += `</tr>`;
                    }

                    $("#studentsContainer").html(htmlStr);
                },

                error: function(err){
                    console.log(err);
                }
            })
        }

        // Initial Page Load
        display();
    </script>

</body>
</html>
