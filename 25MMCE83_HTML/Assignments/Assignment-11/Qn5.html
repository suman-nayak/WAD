
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div id="box" class="container my-4">
        <h2>Dog Details</h2>

        <div class="row g-2" id="dogs-row">

        </div>
    </div>

    <script src="./../jquery-4.0.0.js"></script>

    <script>
        
        $.ajax({
            url: "https://prod-main-api-704464-00tre1p1erm.compute.instacloud-edge.com/api/v1/public/dogs",
            method: "GET",

            success: function(res){
                console.log(res);

                let dogs = res.data.data;
                console.log(dogs);

                let htmlStr = ``;

                for(let d of dogs){
                    htmlStr += `
                    <div class="col-md-3">
                        <div class="card h-100">
                            <img src="${d.image.url}"
                                class="card-img-top"
                                style="height: 180px; object-fit: cover;">

                            <div class="card-body">
                                <h6 class="card-title">${d.name}</h6>
                                <p><b>Lifespan:</b> ${d.life_span}</p>
                                <p><b>Temperament:</b> ${d.temperament}</p>
                            </div>
                        </div>
                    </div>
                    `;
                }

                $("#dogs-row").html(htmlStr);
            },

            error: function(error){
                console.log(error);
                $("#dogs-row").html("<p>Failed to load dog details.</p>");
            }
        })

    </script>

</body>
</html>
