<!-- 5. Make an AJAX call to the following API and display the dog details like
– image, name, lifespan, and temperament in bootstrap cards.
API: https://prod-main-api-704464-00tre1p1erm.compute.instacloud-edge.com/api/v1/public/dogs -->
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Five</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-4">
        <div id="box" class="row g-4"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="./Jq/jquery-4.0.0.js"></script>
    <script>
        $.ajax({
            url: "https://prod-main-api-704464-00tre1p1erm.compute.instacloud-edge.com/api/v1/public/dogs",
            method:"GET",
            success:function(res){
                // console.log(res);
                let data=res.data.data;
                // console.log(data);
                // console.log(res.data.data[0].image.url);
                for(let d of data){
                    // console.log(d.image['url']);
                    // console.log(d.name);
                    // console.log(d.life_span);
                    // console.log(d.temperament);
                    let htmlstr=`
                    <div class="col-md-4 col-sm-6">
                        <div class="card h-100">
                            <img src="${d.image['url']}" class="card-img-top" style="height:250px; object-fit:cover;" alt="">
                            <div class="card-body">
                                <h5 class="card-title">${d.name}</h5>
                                <p class="card-text"><strong>Lifespan:</strong> ${d.life_span}</p>
                                <p class="card-text"><strong>Temperament:</strong> ${d.temperament}</p>
                            </div>
                        </div>
                    </div>`;
                    $("#box").append(htmlstr);
                }
            },
            error:function (err){
                console.log(err);
            }
        })
    </script>
</body>

</html>
