
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container my-4">
        <h2>Student Registration Form</h2>

        <form action="" method="post" id="studentForm">

            <input type="text" id="sic"
                   placeholder="Enter SIC"
                   class="form-control mb-2" required>

            <input type="text" id="name"
                   placeholder="Enter Name"
                   class="form-control mb-2" required>

            <input type="text" id="branch"
                   placeholder="Enter Branch"
                   class="form-control mb-2" required>

            <input type="number" id="cgpa"
                   placeholder="Enter CGPA"
                   class="form-control mb-2"
                   min="0" max="10" step="0.01" required>

            <input type="submit" value="Register"
                   class="btn btn-primary">

        </form>

        <p id="response"></p>
    </div>

    <script src="./../jquery-4.0.0.js"></script>

    <script>
        $("#studentForm").on("submit", function(e){
            e.preventDefault();

            let sic = $("#sic").val();
            let name = $("#name").val();
            let branch = $("#branch").val();
            let cgpa = $("#cgpa").val();

            // Client-side SIC validation
            let pattern = /^[0-9]{2}[A-Z]{4}[0-9]{2}$/;

            if(!pattern.test(sic)){
                $("#response").text("Invalid SIC Format. Example: 25MMCE83");
                $("#response").css({"color": "red"});
                return;
            }

            $.ajax({
                url: "student_add.php",
                method: "POST",
                data: {sic, name, branch, cgpa},

                success: function(res){
                    console.log(res);

                    res = JSON.parse(res);

                    if(res.status == "success"){
                        $("#response").text("Student Registered Successfully");
                        $("#response").css({"color": "green"});

                        $("#sic").val("");
                        $("#name").val("");
                        $("#branch").val("");
                        $("#cgpa").val("");
                    }
                    else{
                        $("#response").text(res.message);
                        $("#response").css({"color": "red"});
                    }
                },

                error: function(err){
                    console.log(err);
                    $("#response").text("Error while registering student");
                    $("#response").css({"color": "red"});
                }
            })
        })
    </script>

</body>
</html>
